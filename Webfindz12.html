body{background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.blur{position:fixed;width:300px;height:300px;border-radius:50%;filter:blur(90px);opacity:.6;z-index:0}
.b1{background:#34c759;top:-50px;left:-50px;animation:gerak 4s infinite alternate}

.card{position:relative;z-index:1;background:rgba(28,28,30,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:28px;padding:32px 24px;text-align:center;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.5)}

h1 span{color:#34c759}
p{color:#aeaeb2;font-size:14px;line-height:1.6;margin:10px 0 18px}
.bar{height:8px;background:#2c2c2e;border-radius:99px;overflow:hidden;margin:0 0 10px}
.isi{height:100%;width:70%;background:linear-gradient(90deg,#34c759,#00ff88);border-radius:99px;animation:loading 1.5s infinite}
@keyframes loading{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.kecil{font-size:12px;color:#8e8e93}
.btn{display:block;background:#34c759;color:#fff;text-decoration:none;padding:14px;border-radius:14px;font-weight:700;margin-top:20px;font-size:15px}
.btn2{display:block;background:#1c1c1e;color:#fff;text-decoration:none;padding:12px;border-radius:14px;font-weight:600;margin-top:10px;font-size:14px;border:1px solid #333}
.dot{animation:kedip 1s infinite}
@keyframes kedip{0%,100%{opacity:1}50%{opacity:.2}}
